name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # goreleaser's before hook runs `go mod tidy`; an untidy go.mod would
      # dirty the tree and fail the real release below.
      - name: Check that go mod tidy leaves no diff
        run: go mod tidy -diff

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --snapshot --clean

      - name: Check archive layout against install.sh
        run: scripts/test-install.sh dist

      # The real release refuses a dirty tree, so fail here with the diff if
      # the snapshot's hooks changed any tracked file.
      - name: Check that the snapshot left the tree clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status
            git diff
            exit 1
          fi

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
