version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: flux-darwin
    main: .
    binary: flux
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Tag}}
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
  - id: flux-linux
    main: .
    binary: flux
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Tag}}
    goos:
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: darwin
    ids:
      - flux-darwin
    formats:
      - tar.gz
    name_template: "flux_{{ .Os }}_{{ .Arch }}"
    # The binary embeds skill/SKILL.md; `flux install` installs it.
    files:
      - none*
  - id: linux
    ids:
      - flux-linux
    formats:
      - tar.gz
    name_template: "flux_{{ .Os }}_{{ .Arch }}"
    # The binary embeds skill/SKILL.md; `flux install` installs it.
    files:
      - none*

checksum:
  name_template: "checksums.txt"

homebrew_casks:
  - name: flux-cli
    ids:
      - darwin
    binaries:
      - flux
    description: Command-line interface for Flux project management
    homepage: https://github.com/eyra/flux-cli
    repository:
      owner: eyra
      name: homebrew-tap
      git:
        url: git@github.com:eyra/homebrew-tap.git
        private_key: '{{ index .Env "HOMEBREW_TAP_DEPLOY_KEY" }}'
    caveats: |
      Install the flux skill for your AI coding agents with one or more of:
        flux install claude
        flux install omp
        flux install codex
      Rerun them after `brew upgrade flux-cli` to update the skill.
    hooks:
      post:
        install_steps: |
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/flux"]

release:
  github:
    owner: eyra
    name: flux-cli
  name_template: "v{{ .Version }}"
